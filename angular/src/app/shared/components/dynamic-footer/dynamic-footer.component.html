<footer class="app-dynamic-footer border-top py-4 mt-auto">
  <div class="container">
    <div class="row align-items-center">
      <!-- Skeleton Loading -->
      <ng-container *ngIf="isLoading; else content">
        <div class="col-md-6 mb-3 mb-md-0 d-flex gap-2 align-items-center placeholder-glow">
          <span class="placeholder col-4 rounded" style="height: 20px;"></span>
        </div>
        <div class="col-md-6 text-md-end text-start placeholder-glow d-flex justify-content-md-end gap-3">
          <span class="placeholder rounded-circle" style="width: 24px; height: 24px;"></span>
          <span class="placeholder rounded-circle" style="width: 24px; height: 24px;"></span>
          <span class="placeholder rounded-circle" style="width: 24px; height: 24px;"></span>
        </div>
      </ng-container>

      <!-- Actual Content -->
      <ng-template #content>
        <!-- Left / Start: Copyright & Site Name -->
        <div class="col-md-6 mb-3 mb-md-0 d-flex flex-column flex-md-row gap-2 align-items-md-center">
          <span class="text-muted d-flex align-items-center gap-1">
            <i class="bi bi-c-circle"></i>
            {{ currentYear }}
            <a href="/" class="text-decoration-none fw-bold site-name-link"
               [style.color]="settings?.primaryColor">
              {{ settings?.siteName || 'SaasDemo' }}
            </a>
            . <span>جميع الحقوق محفوظة.</span>
          </span>
        </div>

        <!-- Right / End: Social Links -->
        <div class="col-md-6 d-flex justify-content-md-end gap-3 social-links" *ngIf="settings">
          <a *ngIf="settings.facebookUrl" [href]="settings.facebookUrl" target="_blank" class="social-link facebook" aria-label="Facebook">
            <i class="bi bi-facebook fs-5"></i>
          </a>
          <a *ngIf="settings.twitterUrl" [href]="settings.twitterUrl" target="_blank" class="social-link twitter" aria-label="Twitter">
            <i class="bi bi-twitter-x fs-5"></i>
          </a>
          <a *ngIf="settings.instagramUrl" [href]="settings.instagramUrl" target="_blank" class="social-link instagram" aria-label="Instagram">
            <i class="bi bi-instagram fs-5"></i>
          </a>
          <a *ngIf="settings.linkedInUrl" [href]="settings.linkedInUrl" target="_blank" class="social-link linkedin" aria-label="LinkedIn">
            <i class="bi bi-linkedin fs-5"></i>
          </a>
        </div>
      </ng-template>
    </div>
  </div>
</footer>
