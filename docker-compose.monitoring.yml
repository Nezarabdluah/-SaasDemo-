version: '3.8'

# ============================================================
# SaasDemo Enterprise Monitoring Stack
# Covers: Load Testing Metrics, APM, Logs, Alerts
# Usage: docker-compose -f docker-compose.monitoring.yml up -d
# ============================================================

services:

  # ─────────────────────────────────────────
  # TIME-SERIES DB for k6 metrics
  # ─────────────────────────────────────────
  influxdb:
    image: influxdb:1.8
    container_name: saasdemo_influxdb
    ports:
      - "8086:8086"
    environment:
      INFLUXDB_DB: k6
      INFLUXDB_ADMIN_USER: admin
      INFLUXDB_ADMIN_PASSWORD: changeme123
      INFLUXDB_HTTP_AUTH_ENABLED: "true"
    volumes:
      - influxdb_data:/var/lib/influxdb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - monitoring

  # ─────────────────────────────────────────
  # VISUALIZATION & DASHBOARDS
  # ─────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: saasdemo_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - monitoring

  # ─────────────────────────────────────────
  # PROMETHEUS (for app metrics)
  # ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: saasdemo_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    restart: unless-stopped
    networks:
      - monitoring

  # ─────────────────────────────────────────
  # STRUCTURED LOG AGGREGATION (.NET)
  # ─────────────────────────────────────────
  seq:
    image: datalust/seq:latest
    container_name: saasdemo_seq
    ports:
      - "5341:80"
    environment:
      ACCEPT_EULA: "Y"
    volumes:
      - seq_data:/data
    restart: unless-stopped
    networks:
      - monitoring

  # ─────────────────────────────────────────
  # DISTRIBUTED TRACING
  # ─────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: saasdemo_jaeger
    ports:
      - "6831:6831/udp"   # Jaeger compact thrift
      - "16686:16686"     # Jaeger UI
      - "4317:4317"       # OTLP gRPC
      - "4318:4318"       # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    restart: unless-stopped
    networks:
      - monitoring

volumes:
  influxdb_data:
  grafana_data:
  prometheus_data:
  seq_data:

networks:
  monitoring:
    name: saasdemo_monitoring_net
    driver: bridge

# ─────────────────────────────────────────
# USAGE COMMANDS:
# ─────────────────────────────────────────
# Start stack:
#   docker-compose -f docker-compose.monitoring.yml up -d
#
# Run k6 with metrics export:
#   k6 run --out influxdb=http://localhost:8086/k6 tests/performance/smoke.js
#
# Access Grafana:
#   http://localhost:3000 (admin/admin123)
#
# Access Jaeger traces:
#   http://localhost:16686
#
# Access Seq logs:
#   http://localhost:5341
#
# Access Prometheus:
#   http://localhost:9090
#
# Stop stack:
#   docker-compose -f docker-compose.monitoring.yml down
#
# Stop and remove volumes:
#   docker-compose -f docker-compose.monitoring.yml down -v
