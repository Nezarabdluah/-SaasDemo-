<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h3 class="card-title">⚙️ إعدادات الموقع</h3>
    <button class="btn btn-primary" (click)="save()" [disabled]="form.invalid || isSaving">
      <i class="fa fa-save me-1"></i> حفظ التغييرات
      <i *ngIf="isSaving" class="fas fa-spinner fa-spin ms-1"></i>
    </button>
  </div>
  
  <div class="card-body">
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="row">
        <!-- قسم المعلومات الأساسية -->
        <div class="col-md-6 mb-4">
          <div class="card bg-light shadow-none">
            <div class="card-body">
              <h5 class="text-primary mb-3">المعلومات الأساسية</h5>
              
              <div class="mb-3">
                <label class="form-label" for="siteName">اسم الموقع *</label>
                <input type="text" id="siteName" formControlName="siteName" class="form-control" placeholder="أدخل اسم الموقع" />
                <small class="text-danger" *ngIf="form.get('siteName').invalid && form.get('siteName').touched">يرجى إدخال اسم الموقع (أقصى حد 128)</small>
              </div>

              <div class="row">
                <div class="col-6 mb-3">
                  <label class="form-label" for="primaryColor">اللون الأساسي *</label>
                  <div class="input-group">
                    <input type="color" id="primaryColor" formControlName="primaryColor" class="form-control form-control-color" style="max-width: 60px; cursor: pointer;" title="اختر اللون" />
                    <input type="text" formControlName="primaryColor" class="form-control text-uppercase" placeholder="#000000" />
                  </div>
                </div>
                <div class="col-6 mb-3">
                  <label class="form-label" for="secondaryColor">اللون الثانوي *</label>
                  <div class="input-group">
                    <input type="color" id="secondaryColor" formControlName="secondaryColor" class="form-control form-control-color" style="max-width: 60px; cursor: pointer;" title="اختر اللون" />
                    <input type="text" formControlName="secondaryColor" class="form-control text-uppercase" placeholder="#000000" />
                  </div>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label d-block">شعار الموقع</label>
                <div class="d-flex align-items-center gap-3">
                  <div class="logo-preview-box border rounded p-2 text-center" style="width: 120px; height: 120px; background: #f8f9fa;">
                    <img *ngIf="logoPreviewUrl" [src]="logoPreviewUrl" class="img-fluid" style="max-height: 100px;" alt="شعار الموقع" />
                    <span *ngIf="!logoPreviewUrl" class="text-muted d-block mt-4 small">لا يوجد شعار</span>
                  </div>
                  <div>
                     <button type="button" class="btn btn-outline-secondary btn-sm" (click)="openMediaPicker()">
                        <i class="fa fa-image me-1"></i> اختيار الشعار من المكتبة
                     </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- التواصل الاجتماعي -->
        <div class="col-md-6 mb-4">
          <div class="card bg-light shadow-none">
            <div class="card-body">
              <h5 class="text-primary mb-3">روابط التواصل الاجتماعي</h5>
              
              <div class="mb-3 input-group">
                <span class="input-group-text"><i class="fab fa-facebook text-primary"></i></span>
                <input type="text" formControlName="facebookUrl" class="form-control" placeholder="رابط فيسبوك" />
              </div>
              
              <div class="mb-3 input-group">
                <span class="input-group-text"><i class="fab fa-twitter text-info"></i></span>
                <input type="text" formControlName="twitterUrl" class="form-control" placeholder="رابط إكس (تويتر)" />
              </div>
              
              <div class="mb-3 input-group">
                <span class="input-group-text"><i class="fab fa-instagram text-danger"></i></span>
                <input type="text" formControlName="instagramUrl" class="form-control" placeholder="رابط إنستغرام" />
              </div>

              <div class="mb-3 input-group">
                <span class="input-group-text"><i class="fab fa-linkedin text-primary"></i></span>
                <input type="text" formControlName="linkedInUrl" class="form-control" placeholder="رابط لينكد إن" />
              </div>
            </div>
          </div>
        </div>

        <!-- إعدادات البريد -->
        <div class="col-12 mb-4">
          <div class="card bg-light shadow-none">
            <div class="card-body">
              <h5 class="text-primary mb-3">إعدادات البريد الإلكتروني (SMTP)</h5>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label" for="smtpHost">خادم SMTP</label>
                  <input type="text" id="smtpHost" formControlName="smtpHost" class="form-control" placeholder="مثال: smtp.gmail.com" />
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label" for="smtpPort">المنفذ (Port)</label>
                  <input type="number" id="smtpPort" formControlName="smtpPort" class="form-control" placeholder="مثال: 587" />
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label" for="smtpUserName">اسم المستخدم</label>
                  <input type="text" id="smtpUserName" formControlName="smtpUserName" class="form-control" />
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label" for="smtpPassword">كلمة المرور (اتركه فارغاً للاحتفاظ بالقديم)</label>
                  <input type="password" id="smtpPassword" formControlName="smtpPassword" class="form-control" />
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label" for="senderEmail">البريد الإلكتروني للُمرسل (From Email)</label>
                  <input type="email" id="senderEmail" formControlName="senderEmail" class="form-control" />
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label" for="senderName">اسم المُرسل (From Name)</label>
                  <input type="text" id="senderName" formControlName="senderName" class="form-control" />
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>

<app-media-picker-modal [isOpen]="isMediaPickerOpen" (closed)="isMediaPickerOpen = false" (imageSelected)="onImageSelected($event)"></app-media-picker-modal>
