global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'saasdemo-monitor'

scrape_configs:
  # ASP.NET Core metrics (when instrumented)
  - job_name: 'aspnet-core'
    static_configs:
      - targets: ['host.docker.internal:5000']
    metrics_path: '/metrics'
    
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
